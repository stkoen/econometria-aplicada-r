name: Reproducir seis ejercicios
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      RENV_PATHS_CACHE: ${{ github.workspace }}/renv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - name: Cache de paquetes de R
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/renv-cache
          key: ${{ runner.os }}-R-4.3.3-renv-${{ hashFiles('renv.lock') }}
      - name: Restaurar paquetes
        run: Rscript --vanilla -e 'install.packages("renv", repos="https://cloud.r-project.org"); renv::restore(project=getwd(), library=renv::paths$library(project=getwd()), prompt=FALSE)'
      - name: Reproducir y comprobar
        run: |
          Rscript --vanilla -e 'renv::load(); source("run_all.R")'
          Rscript --vanilla -e 'renv::load(); source("tests/check_all.R")'
